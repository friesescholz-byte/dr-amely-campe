<svg viewBox="0 0 1440 760" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" class="hero-pattern-svg">
  <defs>
    <!-- Gradients for subtle depth -->
    <linearGradient id="airCurrentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232725" stop-opacity="0" />
      <stop offset="20%" stop-color="#232725" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#1F4E5B" stop-opacity="0.06" />
      <stop offset="80%" stop-color="#232725" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#232725" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="birdFillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.055" />
      <stop offset="60%" stop-color="#232725" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="birdStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.12" />
      <stop offset="70%" stop-color="#232725" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0.04" />
    </linearGradient>

    <!-- Micro Dot Texture (calm, fine paper structure) -->
    <pattern id="heroMicroDots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.8" fill="#232725" fill-opacity="0.03" />
    </pattern>
  </defs>

  <!-- Base Micro Dots -->
  <rect width="100%" height="100%" fill="url(#heroMicroDots)" />

  <!-- Calm Thermal / Air Streamlines across the entire sky -->
  <g class="pattern-airstreams" stroke="url(#airCurrentGrad)" fill="none" stroke-linecap="round">
    <!-- Upper breeze -->
    <path d="M -80,120 C 260,80 580,170 960,110 C 1220,70 1400,130 1560,95" stroke-width="1.0" />
    <!-- Main glide current (dashed) -->
    <path d="M -100,210 C 220,160 520,260 880,195 C 1180,140 1380,210 1580,175" stroke-width="0.85" stroke-dasharray="5 9" />
    <!-- Mid horizon current -->
    <path d="M -60,320 C 300,270 640,360 1020,290 C 1260,240 1440,310 1600,270" stroke-width="1.1" />
    <!-- Lower gentle wave (fine dash) -->
    <path d="M -120,440 C 240,400 560,480 920,410 C 1240,350 1420,430 1620,380" stroke-width="0.75" stroke-dasharray="4 8" />
    <!-- Base thermal wave -->
    <path d="M -80,560 C 280,510 620,600 980,520 C 1280,450 1460,530 1620,490" stroke-width="1.0" />
  </g>

  <!-- Large Soaring Brand Bird (Centered / Upper Right of Hero Canvas) -->
  <g class="pattern-main-bird" transform="translate(820, 100)">
    <!-- Ambient flight radius aura / nautical compass ring -->
    <ellipse cx="270" cy="90" rx="360" ry="190" stroke="#1F4E5B" stroke-opacity="0.035" stroke-width="0.9" stroke-dasharray="3 10" fill="none" />
    <circle cx="270" cy="90" r="240" stroke="#232725" stroke-opacity="0.02" stroke-width="0.75" fill="none" />

    <!-- Delicate flight path curve leading toward the bird -->
    <path d="M -180,220 C -60,175 120,130 250,100" stroke="#1F4E5B" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="4 6" fill="none" />

    <!-- Updraft Echo Contour (Echo wave above the wing) -->
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          transform="translate(-12, -14) scale(1.04)"
          fill="none" 
          stroke="#1F4E5B" 
          stroke-opacity="0.045" 
          stroke-width="0.9" 
          stroke-dasharray="3 7" />

    <!-- The Primary Soaring Seagull -->
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          fill="url(#birdFillGrad)" 
          stroke="url(#birdStrokeGrad)" 
          stroke-width="1.3" 
          stroke-linejoin="round" />

    <!-- Internal wing flow accent line -->
    <path d="M 120,95 C 190,82 250,60 350,38 C 420,24 470,22 520,30" 
          fill="none" 
          stroke="url(#birdStrokeGrad)" 
          stroke-width="0.8" 
          stroke-dasharray="2 4" />

    <!-- Subtle Staffhorst geo-coordinates label (Whispering typographic detail) -->
    <text x="270" y="295" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="10" 
          font-weight="500" 
          letter-spacing="0.22em" 
          fill="#232725" 
          fill-opacity="0.12" 
          text-anchor="middle">52°43'00"N · 08°59'00"E</text>
  </g>

  <!-- Subtle Second Bird in the Distance (Left sky, soaring higher) -->
  <g class="pattern-distant-bird" transform="translate(380, 80) scale(0.32)">
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          fill="#1F4E5B" 
          fill-opacity="0.04" 
          stroke="#1F4E5B" 
          stroke-opacity="0.07" 
          stroke-width="1.5" />
  </g>

  <!-- Subtle Third Micro Bird (Far horizon) -->
  <g class="pattern-micro-bird" transform="translate(1260, 60) scale(0.20)">
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          fill="#232725" 
          fill-opacity="0.03" 
          stroke="#232725" 
          stroke-opacity="0.06" 
          stroke-width="1.5" />
  </g>

  <!-- Ambient Nautical Crosshairs (+) for bespoke architectural look -->
  <g class="pattern-crosshairs" stroke="#232725" stroke-opacity="0.04" stroke-width="1">
    <!-- Crosshair 1 -->
    <line x1="220" y1="170" x2="220" y2="184" />
    <line x1="213" y1="177" x2="227" y2="177" />

    <!-- Crosshair 2 -->
    <line x1="740" y1="75" x2="740" y2="89" />
    <line x1="733" y1="82" x2="747" y2="82" />

    <!-- Crosshair 3 -->
    <line x1="1340" y1="260" x2="1340" y2="274" />
    <line x1="1333" y1="267" x2="1347" y2="267" />
  </g>
</svg>