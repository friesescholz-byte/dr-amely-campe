<svg viewBox="0 0 1440 720" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" class="combination-pattern-svg">
  <defs>
    <!-- Soft Brand Gradients for Combination Section -->
    <linearGradient id="combAirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#232725" stop-opacity="0" />
      <stop offset="25%" stop-color="#232725" stop-opacity="0.04" />
      <stop offset="50%" stop-color="#1F4E5B" stop-opacity="0.07" />
      <stop offset="75%" stop-color="#232725" stop-opacity="0.035" />
      <stop offset="100%" stop-color="#232725" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="combBirdFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.065" />
      <stop offset="60%" stop-color="#232725" stop-opacity="0.045" />
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="combBirdStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F4E5B" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#232725" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#1F4E5B" stop-opacity="0.04" />
    </linearGradient>

    <!-- Micro Dot Texture (calm paper feel) -->
    <pattern id="combMicroDots" width="56" height="56" patternUnits="userSpaceOnUse">
      <circle cx="28" cy="28" r="0.8" fill="#232725" fill-opacity="0.025" />
    </pattern>
  </defs>

  <!-- Base Micro Dots -->
  <rect width="100%" height="100%" fill="url(#combMicroDots)" />

  <!-- Flowing Calm Thermal Streamlines across the section -->
  <g class="combination-airstreams" stroke="url(#combAirGrad)" fill="none" stroke-linecap="round">
    <path d="M -80,100 C 280,50 640,140 1020,80 C 1260,40 1440,100 1560,70" stroke-width="1.0" />
    <path d="M -100,210 C 220,160 540,260 920,190 C 1220,130 1400,200 1580,170" stroke-width="0.85" stroke-dasharray="5 9" />
    <path d="M -60,390 C 320,340 680,440 1060,370 C 1280,320 1460,390 1600,350" stroke-width="1.1" />
    <path d="M -120,540 C 260,490 600,580 960,510 C 1260,450 1420,530 1620,490" stroke-width="0.85" stroke-dasharray="4 8" />
    <path d="M -80,660 C 300,610 640,700 1020,640 C 1300,580 1480,660 1620,620" stroke-width="1.0" />
  </g>

  <!-- BIRD 1: Primary Soaring Seagull (Above / Beside "Tierärztin und Supervisorin") -->
  <g class="combination-bird-1" transform="translate(120, 50) scale(0.90)">
    <!-- Ambient flight radius aura / nautical compass ring -->
    <ellipse cx="270" cy="90" rx="330" ry="175" stroke="#1F4E5B" stroke-opacity="0.04" stroke-width="0.9" stroke-dasharray="3 10" fill="none" />
    <circle cx="270" cy="90" r="210" stroke="#232725" stroke-opacity="0.025" stroke-width="0.75" fill="none" />

    <!-- Flight path glide line -->
    <path d="M -160,210 C -50,170 120,125 250,95" stroke="#1F4E5B" stroke-opacity="0.065" stroke-width="1" stroke-dasharray="4 6" fill="none" />

    <!-- Updraft Echo Contour -->
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          transform="translate(-10, -12) scale(1.03)"
          fill="none" 
          stroke="#1F4E5B" 
          stroke-opacity="0.045" 
          stroke-width="0.9" 
          stroke-dasharray="3 7" />

    <!-- Primary Soaring Seagull Body -->
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          fill="url(#combBirdFill)" 
          stroke="url(#combBirdStroke)" 
          stroke-width="1.3" 
          stroke-linejoin="round" />

    <!-- Internal wing flow accent line -->
    <path d="M 120,95 C 190,82 250,60 350,38 C 420,24 470,22 520,30" 
          fill="none" 
          stroke="url(#combBirdStroke)" 
          stroke-width="0.8" 
          stroke-dasharray="2 4" />
  </g>

  <!-- BIRD 2: Companion Seagull (Gliding in partnership / dual perspective) -->
  <g class="combination-bird-2" transform="translate(560, 100) scale(0.50)">
    <circle cx="270" cy="90" r="180" stroke="#1F4E5B" stroke-opacity="0.035" stroke-width="0.8" stroke-dasharray="3 8" fill="none" />
    <path d="M 0,165 C 25,145 60,110 115,92 C 165,76 210,80 230,86 C 275,60 325,18 385,5 C 435,-6 490,12 540,30 C 485,32 415,36 345,68 C 295,90 265,110 252,120 C 260,121 268,123 274,126 C 264,130 252,136 248,142 C 238,155 215,168 175,152 C 135,136 80,140 0,165 Z" 
          fill="url(#combBirdFill)" 
          stroke="url(#combBirdStroke)" 
          stroke-width="1.5" 
          stroke-linejoin="round" />
  </g>
</svg>
